{% extends 'base.html' %}
{% block title %}Enviar para Assinatura{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold mb-2">Enviar para Assinatura</h1>
  <p class="text-gray-500 text-sm mb-6">Documento: <strong>{{ doc.title }}</strong></p>
  <div class="bg-white rounded-xl shadow-sm p-6">
    {% include 'components/flash_messages.html' %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium mb-1">Nome do Signatário</label>
          <input type="text" name="signatory_name" required
                 class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">E-mail do Signatário</label>
          <input type="email" name="signatory_email" required
                 class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium mb-1">CPF (opcional)</label>
          <input type="text" name="signatory_cpf" placeholder="000.000.000-00"
                 class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Celular (opcional, para OTP SMS)</label>
          <input type="text" name="signatory_phone" placeholder="+5511999999999"
                 class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div>
          <label class="block text-sm font-medium mb-1">Método de Assinatura</label>
          <select name="method" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
            <option value="email_otp">OTP por E-mail (Avançada)</option>
            <option value="sms_otp">OTP por SMS (Avançada)</option>
            <option value="digital_cert">Certificado Digital ICP-Brasil (Qualificada)</option>
            <option value="simple">Eletrônica Simples</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Ordem de Assinatura</label>
          <input type="number" name="signing_order" value="1" min="1"
                 class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
        </div>
      </div>
      <div class="flex gap-3">
        <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">
          Enviar Convite
        </button>
        <a href="{{ url_for('admin_documents.document_detail', doc_id=doc.id) }}"
           class="px-4 py-2 text-gray-500 hover:text-gray-700">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
