{% extends 'base.html' %}
{% block title %}{{ 'Editar' if action == 'edit' else 'Novo' }} Template{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
  <h1 class="text-2xl font-bold mb-6">{{ 'Editar' if action == 'edit' else 'Novo' }} Template</h1>
  <div class="bg-white rounded-xl shadow-sm p-6">
    {% include 'components/flash_messages.html' %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium mb-1">Nome do Template</label>
          <input type="text" name="name" required value="{{ tpl.name if tpl else '' }}"
                 class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Planilha Padrão (opcional)</label>
          <select name="sheet_connection_id"
                  class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
            <option value="">— Nenhuma —</option>
            {% for s in sheets %}
            <option value="{{ s.id }}" {{ 'selected' if tpl and tpl.sheet_connection_id == s.id else '' }}>
              {{ s.display_name }}
            </option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">Descrição</label>
        <input type="text" name="description" value="{{ tpl.description if tpl else '' }}"
               class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium mb-1">
          HTML do Documento
          <span class="text-gray-400 font-normal">(use <code class="bg-gray-100 px-1 rounded">{{ '{{' }} variavel {{ '}}' }}</code> para campos dinâmicos)</span>
        </label>
        <textarea name="html_content" rows="20"
                  class="w-full border rounded-lg px-3 py-2 font-mono text-xs focus:ring-2 focus:ring-indigo-400 focus:outline-none">{{ html_content if html_content else '' }}</textarea>
      </div>
      <div class="flex gap-3">
        <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">
          Salvar Template
        </button>
        <a href="{{ url_for('admin_templates.list_templates') }}" class="px-4 py-2 text-gray-500 hover:text-gray-700">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
