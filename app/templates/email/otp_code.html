<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"></head>
<body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: auto; padding: 20px;">
  <h2 style="color: #4338ca;">✒️ {{ platform }}</h2>
  <p>Olá, <strong>{{ sig_req.signatory_name }}</strong>!</p>
  <p>Seu código de verificação para assinar o documento é:</p>
  <div style="text-align:center; margin: 30px 0;">
    <span style="font-size:40px; font-weight:bold; letter-spacing:12px; color:#1e3a5f; background:#f0f4ff; padding:16px 24px; border-radius:12px;">
      {{ code }}
    </span>
  </div>
  <p>Este código é válido por <strong>10 minutos</strong>. Não compartilhe este código.</p>
  <hr style="border-color:#eee;">
  <p style="font-size:11px; color:#aaa;">{{ platform }} — Plataforma de Assinaturas Eletrônicas</p>
</body>
</html>
