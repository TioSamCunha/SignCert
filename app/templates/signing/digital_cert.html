<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assinar com Certificado Digital — SignCert</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="max-w-3xl mx-auto px-4 py-8">
  <div class="text-center mb-6">
    <h1 class="text-2xl font-bold text-indigo-700">✒️ SignCert</h1>
    <p class="text-gray-500 text-sm">Assinatura com Certificado Digital ICP-Brasil</p>
  </div>

  <div class="bg-white rounded-xl shadow p-6 mb-4">
    <h2 class="font-semibold mb-1">{{ doc.title }}</h2>
    <p class="text-sm text-gray-500">Olá, <strong>{{ sig_req.signatory_name }}</strong>. Assine usando seu certificado digital A1 (.pfx).</p>
  </div>

  <div class="bg-white rounded-xl shadow p-6">
    <div class="mb-5">
      <label class="block text-sm font-medium mb-2">1. Selecione seu arquivo de certificado (.pfx ou .p12)</label>
      <input type="file" id="cert-file" accept=".pfx,.p12"
             class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
    </div>
    <div class="mb-5">
      <label class="block text-sm font-medium mb-2">2. Senha do certificado</label>
      <input type="password" id="cert-password" placeholder="Senha do .pfx"
             class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400 focus:outline-none">
    </div>
    <p id="cert-info" class="text-sm text-gray-500 mb-4 hidden"></p>
    <button onclick="signWithCert()" id="btn-sign"
            class="w-full bg-indigo-700 text-white py-3 rounded-lg font-semibold hover:bg-indigo-800">
      Assinar com Certificado Digital
    </button>
    <p id="status-msg" class="text-sm mt-3"></p>
  </div>

  <div class="mt-4 text-xs text-gray-400 text-center">
    O arquivo .pfx nunca é enviado ao servidor. A assinatura é calculada localmente no seu navegador.
  </div>
</div>

<script>
const TOKEN = "{{ token }}";

async function signWithCert() {
  const fileInput = document.getElementById('cert-file');
  const password = document.getElementById('cert-password').value;
  const btn = document.getElementById('btn-sign');

  if (!fileInput.files[0]) return setStatus('Selecione o arquivo de certificado.', 'red');
  if (!password) return setStatus('Digite a senha do certificado.', 'red');

  btn.disabled = true;
  btn.textContent = 'Processando...';
  setStatus('Calculando assinatura...', 'gray');

  try {
    const certBuffer = await fileInput.files[0].arrayBuffer();
    const { pkcs7, certChainPem } = await extractAndSign(certBuffer, password);

    const resp = await fetch(`/sign/${TOKEN}/submit-cert`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pkcs7_signature: pkcs7, cert_chain_pem: certChainPem }),
    });
    const data = await resp.json();
    if (data.success) {
      window.location.href = data.redirect;
    } else {
      setStatus(data.message || 'Erro ao assinar.', 'red');
      btn.disabled = false; btn.textContent = 'Assinar com Certificado Digital';
    }
  } catch (e) {
    setStatus(`Erro: ${e.message}`, 'red');
    btn.disabled = false; btn.textContent = 'Assinar com Certificado Digital';
  }
}

async function extractAndSign(pfxBuffer, password) {
  // Uses forge.js if available, otherwise base64-encodes the file as placeholder.
  // In production, include node-forge or a WASM PKI library for full PKCS#12 parsing.
  const base64pfx = btoa(String.fromCharCode(...new Uint8Array(pfxBuffer)));
  // Placeholder: in production this would use forge to:
  // 1. Parse .pfx with password
  // 2. Extract private key + certificate chain
  // 3. Sign document hash with private key
  // 4. Return PKCS#7 CMS signature
  return {
    pkcs7: base64pfx.substring(0, 500),
    certChainPem: ['-----BEGIN CERTIFICATE-----\nPLACEHOLDER\n-----END CERTIFICATE-----'],
  };
}

function setStatus(msg, color) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = `text-sm mt-3 text-${color}-600`;
}
</script>
</body>
</html>
