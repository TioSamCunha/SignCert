<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assinatura Concluída — SignCert</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
<div class="max-w-md mx-auto text-center px-4">
  <div class="bg-white rounded-xl shadow-md p-10">
    <div class="text-6xl mb-4">✅</div>
    <h1 class="text-2xl font-bold text-green-700 mb-2">Documento Assinado!</h1>
    {% if sig_req %}
    <p class="text-gray-600 mb-4">
      Obrigado, <strong>{{ sig_req.signatory_name }}</strong>.<br>
      Sua assinatura foi registrada com sucesso.
    </p>
    {% endif %}
    <p class="text-xs text-gray-400">
      Esta assinatura possui validade jurídica conforme Lei 14.063/2020 e MP 2.200-2/2001.
    </p>
  </div>
</div>
</body>
</html>
