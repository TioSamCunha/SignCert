{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-20">
  <div class="bg-white rounded-xl shadow-md p-8">
    <h1 class="text-2xl font-bold text-indigo-700 mb-6 text-center">✒️ SignCert</h1>
    {% include 'components/flash_messages.html' %}
    <form method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">E-mail</label>
        <input type="email" name="email" required autofocus
               class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">Senha</label>
        <input type="password" name="password" required
               class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div class="flex items-center mb-6">
        <input type="checkbox" name="remember" id="remember" class="mr-2">
        <label for="remember" class="text-sm text-gray-600">Lembrar-me</label>
      </div>
      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition">
        Entrar
      </button>
    </form>
  </div>
</div>
{% endblock %}
