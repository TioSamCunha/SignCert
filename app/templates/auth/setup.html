{% extends 'base.html' %}
{% block title %}Configuração Inicial{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-20">
  <div class="bg-white rounded-xl shadow-md p-8">
    <h1 class="text-2xl font-bold text-indigo-700 mb-2 text-center">✒️ SignCert</h1>
    <p class="text-center text-gray-500 mb-6 text-sm">Criar conta de administrador</p>
    {% include 'components/flash_messages.html' %}
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">Nome completo</label>
        <input type="text" name="full_name" required
               class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1">E-mail</label>
        <input type="email" name="email" required
               class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium mb-1">Senha</label>
        <input type="password" name="password" required minlength="8"
               class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition">
        Criar Administrador
      </button>
    </form>
  </div>
</div>
{% endblock %}
